name: tkd_app
description: A new Flutter application.

# The following line prevents the package from being accidentally published to
# pub.dev using `pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
version: 2.0.0+3

environment:
  sdk: ">=2.12.0 <3.0.0"

dependencies:
  flutter:
    sdk: flutter


  # The following adds the Cupertino Icons font to your application.
  # Use with the CupertinoIcons class for iOS style icons.
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.2
  shared_preferences:
  provider:
  http: ^0.13.1
  get_it:
  shimmer:
  overlay_support:
  pin_code_fields: ^8.0.1
  intl:
  multi_select_flutter: ^4.0.0
  getwidget: ^4.0.0
  share:
  image_picker: ^0.8.5+3
  url_launcher:
  # flutter_form_builder: ^6.0.1
  flutter_form_builder: ^9.1.0
  flutter_staggered_grid_view:
  staggered_grid_view_flutter: ^0.0.4
  platform_device_id: ^1.0.1
  flutter_switch: ^0.3.2
  form_field_validator:
  wc_form_validators: ^1.0.0
  whatsapp_unilink: ^2.0.1+1
  file_picker: ^8.1.7
  pull_to_refresh:
  number_pagination: ^0.0.3+2
  translator: ^0.1.7
  carousel_slider: ^5.0.0
  aligned_dialog: ^0.0.6
  flutter_spinkit: ^5.1.0
  dropdown_search: ^5.0.6
  flutter_screenutil:
  universal_html: ^2.0.8
  font_awesome_flutter:
  photo_view: ^0.14.0
  whatsapp: ^2.0.0
  uni_links: ^0.5.1
  uni_links_web:
  google_fonts:
  upgrader:
  flutter_svg: ^1.1.6
  flutter_chat_ui: ^1.6.6
  footer: ^0.0.4
  cached_network_image:
  flutter_rating_bar:
  timeago:
  simple_circular_progress_bar:
  razorpay_web: any
  fl_chart: ^0.70.2

dev_dependencies:
  flutter_test:
    sdk: flutter

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter.
flutter:

  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true
  generate: true
  # To add assets to your application, add an assets section, like this:
  assets:
    - assets/images/
    - assets/svg/
    - assets/language/
    - assets/images/navigation_image/

  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/assets-and-images/#resolution-aware.

  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/assets-and-images/#from-packages

  # To add custom fonts to your application, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
  # example:
  fonts:
    - family: RobotoSlabBold
      fonts:
        - asset: assets/font/robotoslab_bold.ttf
    - family: RobotoBlack
      fonts:
        - asset: assets/font/roboto_black.ttf
    - family: RobotoBlackItalic
      fonts:
        - asset: assets/font/roboto_blackitalic.ttf
    - family: RobotoBold
      fonts:
        - asset: assets/font/roboto_bold.ttf
    - family: RobotoBoldItalic
      fonts:
        - asset: assets/font/roboto_bolditalic.ttf
    - family: RobotoItalic
      fonts:
        - asset: assets/font/roboto_italic.ttf
    - family: RobotoLight
      fonts:
        - asset: assets/font/roboto_light.ttf
    - family: RobotoLightItalic
      fonts:
        - asset: assets/font/roboto_lightitalic.ttf
    - family: RobotoMedium
      fonts:
        - asset: assets/font/roboto_medium.ttf
    - family: RobotoMediumItatic
      fonts:
        - asset: assets/font/roboto_mediumitalic.ttf
    - family: RobotoRegular
      fonts:
        - asset: assets/font/roboto_regular.ttf
    - family: RobotoThin
      fonts:
        - asset: assets/font/roboto_thin.ttf
    - family: RobotoThinItalic
      fonts:
        - asset: assets/font/roboto_thinitalic.ttf
    - family: RobotoConBold
      fonts:
        - asset: assets/font/robotocondensed_bold.ttf
    - family: RobotoConBoldItalic
      fonts:
        - asset: assets/font/robotocondensed_bolditalic.ttf
    - family: RobotoConItalic
      fonts:
        - asset: assets/font/robotocondensed_italic.ttf
    - family: RobotoConLight
      fonts:
        - asset: assets/font/robotocondensed_light.ttf
    - family: RobotoConLightItalic
      fonts:
        - asset: assets/font/robotocondensed_lightitalic.ttf
    - family: RobotoConRegular
      fonts:
        - asset: assets/font/robotocondensed_regular.ttf
    - family: RobotoSlabLight
      fonts:
        - asset: assets/font/robotoslab_light.ttf
    - family: RobotoSlabRegular
      fonts:
        - asset: assets/font/robotoslab_regular.ttf
    - family: RobotoSlabThin
      fonts:
        - asset: assets/font/robotoslab_thin.ttf






